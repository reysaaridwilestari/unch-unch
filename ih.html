<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kado Buku Ultra-Realistis</title>
    <style>
        :root {
            --bg-color: #aeb5b8;
            --book-cover: #3d0a0a; /* Merah marun tua */
            --paper: #fefcf0; /* Kertas antik */
            --gold: #d4af37;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 2500px;
            font-family: 'Georgia', serif;
            overflow: hidden; /* Mencegah layar geser di HP */
        }

        /* CONTAINER UTAMA */
        .book-container {
            position: relative;
            width: 350px;
            height: 500px;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            transform: rotateX(10deg) rotateY(-5deg);
        }

        /* EFEK SAAT BUKU DIBUKA */
        .book-container.open {
            transform: translateX(170px) rotateX(0deg) rotateY(0deg);
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        /* TEKSTUR TUMPUKAN KERTAS DI SAMPING */
        .book::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 100%;
            height: 98.5%;
            background: #fff;
            border-radius: 0 5px 5px 0;
            transform: translateZ(-15px);
            box-shadow: 10px 10px 40px rgba(0,0,0,0.4);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 1px, #ddd 1px, #ddd 2px);
        }

        /* SAMPUL & HALAMAN KIRI */
        .cover-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform-origin: left;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
        }

        .cover-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--book-cover);
            background-image: url('https://www.transparenttextures.com/patterns/leather.png');
            border-radius: 2px 10px 10px 2px;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
        }

        .cover-back-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 10px 2px 2px 10px;
            transform: rotateY(180deg);
            backface-visibility: hidden;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            /* Siluet batas lipatan kiri */
            box-shadow: inset -40px 0 50px rgba(0,0,0,0.15), inset -1px 0 2px rgba(0,0,0,0.2);
        }

        /* HALAMAN KANAN */
        .page-right {
            position: absolute;
            width: 99%;
            height: 99%;
            top: 0.5%;
            left: 0;
            background-color: var(--paper);
            border-radius: 2px 10px 10px 2px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Siluet batas lipatan kanan */
            box-shadow: inset 40px 0 50px rgba(0,0,0,0.15), inset 1px 0 2px rgba(0,0,0,0.2);
        }

        /* GARIS TENGAH (LIPATAN BUKU) */
        .center-fold {
            position: absolute;
            left: 0;
            width: 3px;
            height: 100%;
            background: rgba(0,0,0,0.2);
            z-index: 20;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .gold-decoration {
            border: 1px solid var(--gold);
            outline: 4px double var(--gold);
            outline-offset: -15px;
            width: 80%;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .polaroid {
            width: 65%;
            background: white;
            padding: 10px 10px 45px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            transform: rotate(2deg);
            opacity: 0;
            transition: all 0.7s ease-out 0.8s;
        }

        .polaroid img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
            filter: sepia(0.2) contrast(1.1);
        }

        .wish-text {
            color: #333;
            text-align: center;
            font-style: italic;
            line-height: 1.8;
            opacity: 0;
            transition: opacity 0.7s ease 1s;
        }

        .open .cover-wrapper { transform: rotateY(-180deg); }
        .open .polaroid { opacity: 1; transform: rotate(-1deg); }
        .open .wish-text { opacity: 1; }

        .hint {
            position: absolute;
            bottom: 20px;
            color: #444;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- PERBAIKAN RESPONSIVE AGAR TIDAK KEPOTONG DI HP --- */
        @media screen and (max-width: 600px) {
            .book-container {
                /* Perkecil buku agar muat lebar layar HP */
                transform: scale(0.55) rotateX(10deg) rotateY(-5deg);
                /* Geser posisi dasar ke kiri agar saat terbuka tidak "lari" ke kanan */
                left: -65px; 
            }

            .book-container.open {
                /* Geser hanya sedikit ke kanan agar halaman kanan tetap masuk layar */
                transform: translateX(65px) scale(0.55) rotateX(0deg) rotateY(0deg);
            }

            .wish-text {
                padding: 15px;
                font-size: 0.85rem;
            }

            .polaroid {
                width: 75%; /* Sedikit diperbesar di layar kecil agar foto jelas */
                padding: 8px 8px 35px 8px;
            }
        }
    </style>
</head>
<body>

    <audio id="hbdAudio" loop>
        <source src="https://files.catbox.moe/9d7hp4.mp3" type="audio/mpeg">
    </audio>

    <div class="book-container" id="bookCont">
        <div class="book" onclick="openBook()">
            <div class="cover-wrapper">
                <div class="cover-front">
                    <div class="gold-decoration">
                        <h2 style="margin:0; font-weight: normal; letter-spacing: 4px;">A SIMPLE</h2>
                        <h1 style="font-size: 2.5rem; margin: 10px 0;">GIFT</h1>
                        <div style="width: 40px; height: 1px; background: var(--gold);"></div>
                        <p style="font-size: 1rem; margin-top: 15px;">FOR YOU</p>
                    </div>
                </div>
                
                <div class="cover-back-page">
                    <div class="wish-text">
                        <h3 style="font-family: 'Times New Roman', serif; color: var(--book-cover); margin-top: 0;">Dearest One,</h3>
                        <p>"Setiap lembar masa, moga bahagiamu kian subur. Selamat meraikan hari lahirmu yang istimewa."</p>
                        <div style="margin-top: 20px; font-size: 1.5rem;">❦</div>
                    </div>
                </div>
            </div>

            <div class="page-right">
                <div class="center-fold"></div>
                <div class="polaroid">
                    <img src="https://i.ibb.co.com/Z1vv5gYS/aku.jpg" alt="aku">
                    <div style="margin-top: 15px; text-align: center; font-family: 'Brush Script MT', cursive; font-size: 1.4rem;">
                        Happy Birthday! ✨
                    </div>
                </div>
            </div>
        </div>
    </div>

    <p class="hint">Sentuh untuk membuka 📖</p>

    <script>
        function openBook() {
            const cont = document.getElementById('bookCont');
            const audio = document.getElementById('hbdAudio');
            
            cont.classList.toggle('open');
            
            if(cont.classList.contains('open')) { 
                audio.play().catch(() => {
                    // Penanganan jika browser memblokir autoplay
                    console.log("Audio play diblokir browser");
                }); 
            } else { 
                audio.pause();
                audio.currentTime = 0; 
            }
        }
    </script>
</body>
</html>
