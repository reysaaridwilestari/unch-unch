<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kado Buku Siluet Realistis</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #aeb5b8;
            --book-cover: #3d0a0a; 
            --paper: #fefcf0; 
            --gold: #d4af37;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 2500px;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .book-container {
            position: relative;
            width: 350px;
            height: 500px;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            transform: rotateX(10deg) rotateY(-5deg);
        }

        .book-container.open {
            transform: translateX(175px) rotateX(0deg) rotateY(0deg);
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .cover-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform-origin: left;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
        }

        .cover-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--book-cover);
            background-image: url('https://www.transparenttextures.com/patterns/leather.png');
            border-radius: 2px 10px 10px 2px;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
        }

        .cover-back-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 10px 2px 2px 10px;
            transform: rotateY(180deg);
            backface-visibility: hidden;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            /* Siluet gelap di sisi kanan (lipatan) */
            box-shadow: inset -15px 0 20px -10px rgba(0,0,0,0.3);
        }

        .page-right {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 2px 10px 10px 2px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Siluet gelap di sisi kiri (lipatan) */
            box-shadow: inset 15px 0 20px -10px rgba(0,0,0,0.3), 5px 5px 15px rgba(0,0,0,0.1);
        }

        /* Garis siluet sangat tipis di tengah agar terlihat ada pertemuan kertas */
        .fold-shadow {
            position: absolute;
            left: 0;
            width: 1px;
            height: 100%;
            background: rgba(0,0,0,0.2);
            z-index: 10;
        }

        .gold-decoration {
            border: 1px solid var(--gold);
            outline: 4px double var(--gold);
            outline-offset: -15px;
            width: 80%;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--gold);
        }

        .polaroid {
            width: 70%;
            background: white;
            padding: 10px 10px 45px 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            transform: rotate(2deg);
            opacity: 0;
            transition: all 0.7s ease-out 0.8s;
        }

        .polaroid img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
        }

        .wish-text {
            color: #333;
            text-align: center;
            opacity: 0;
            transition: opacity 0.7s ease 1s;
        }

        .wish-text h3 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
        }

        .wish-text p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            line-height: 1.6;
        }

        .open .cover-wrapper { transform: rotateY(-180deg); }
        .open .polaroid { opacity: 1; transform: rotate(-1deg) scale(1); }
        .open .wish-text { opacity: 1; }

        .hint {
            position: absolute;
            bottom: 20px;
            color: #444;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media screen and (max-width: 600px) {
            .book-container {
                transform: scale(0.65) rotateX(10deg);
                margin-left: -15px;
            }
            .book-container.open {
                transform: translateX(130px) scale(0.65);
            }
            .hint { bottom: 30px; }
        }
    </style>
</head>
<body>

    <audio id="hbdAudio" loop>
        <source src="https://files.catbox.moe/9d7hp4.mp3" type="audio/mpeg">
    </audio>

    <div class="book-container" id="bookCont">
        <div class="book" onclick="openBook()">
            <div class="cover-wrapper">
                <div class="cover-front">
                    <div class="gold-decoration">
                        <h2 style="margin:0; font-weight: normal; letter-spacing: 4px; font-size: 2rem;">A SIMPLE</h2>
                        <h1 style="font-size: 2.5rem; margin: 10px 0; font-family: 'Playfair Display';">GIFT</h1>
                        <div style="width: 40px; height: 1px; background: var(--gold);"></div>
                        <p style="font-size: 0.7rem; margin-top: 15px; letter-spacing: 3px;">FOR YOU</p>
                    </div>
                </div>
                
                <div class="cover-back-page">
                    <div class="wish-text">
                        <h3>Dearest One,</h3>
                        <p>"Setiap tahun adalah bab baru dalam buku hidupmu. Semoga setiap halaman penuh dengan kebahagiaan dan cinta."</p>
                        <div style="margin-top: 25px; font-size: 1.5rem; color: var(--gold);">❦</div>
                    </div>
                </div>
            </div>

            <div class="page-right">
                <div class="fold-shadow"></div>
                <div class="polaroid">
                    <img src="https://i.ibb.co.com/Z1vv5gYS/aku.jpg" alt="Foto">
                    <div style="margin-top: 15px; text-align: center; font-family: 'Great Vibes', cursive; font-size: 1.6rem; color: #444;">
                        Happy Birthday! ✨
                    </div>
                </div>
            </div>
        </div>
    </div>

    <p class="hint">Sentuh untuk membuka 📖</p>

    <script>
        function openBook() {
            const cont = document.getElementById('bookCont');
            const audio = document.getElementById('hbdAudio');
            cont.classList.toggle('open');
            if(cont.classList.contains('open')) { audio.play().catch(e => {}); } 
            else { audio.pause(); audio.currentTime = 0; }
        }
    </script>
</body>
</html>
