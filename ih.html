<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kado Buku - Premium Siluet</title>
    <style>
        :root {
            --bg-color: #aeb5b8;
            --book-cover: #3d0a0a;
            --paper: #fefcf0;
            --gold: #d4af37;
            --fold-dark: rgba(0, 0, 0, 0.35);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 2500px;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        /* --- OVERLAY LOCK LANDSCAPE --- */
        #landscape-lock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            visibility: hidden; /* Default sembunyi di Desktop */
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* Munculkan lock hanya di HP posisi Portrait */
        @media screen and (max-width: 900px) and (orientation: portrait) {
            #landscape-lock {
                visibility: visible;
                opacity: 1;
            }
        }

        .phone-icon {
            font-size: 50px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* --- KONTEN BUKU --- */
        #main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        /* Skala buku di HP Landscape */
        @media screen and (max-width: 900px) and (orientation: landscape) {
            #main-wrapper {
                transform: scale(0.65); 
            }
        }

        .book-container {
            position: relative;
            width: 320px;
            height: 460px;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            transform: rotateX(10deg) rotateY(-5deg);
        }

        .book-container.open {
            transform: translateX(160px) rotateX(0deg) rotateY(0deg);
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        /* SILUET LIPATAN PREMIUM */
        .cover-back-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 8px 2px 2px 8px;
            transform: rotateY(180deg);
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            background-image: linear-gradient(to right, transparent 85%, rgba(0,0,0,0.03) 100%);
            box-shadow: inset -50px 0 50px -20px var(--fold-dark), inset -1px 0 2px rgba(0,0,0,0.2);
        }

        .page-right {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 2px 8px 8px 2px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(to left, transparent 85%, rgba(0,0,0,0.03) 100%);
            box-shadow: inset 50px 0 50px -20px var(--fold-dark), inset 1px 0 2px rgba(0,0,0,0.2);
        }

        .center-spine {
            position: absolute;
            left: 0;
            width: 3px;
            height: 100%;
            background: rgba(0,0,0,0.1);
            z-index: 20;
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
        }

        .cover-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform-origin: left;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
        }

        .cover-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--book-cover);
            background-image: url('https://www.transparenttextures.com/patterns/leather.png');
            border-radius: 2px 8px 8px 2px;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
        }

        .gold-decoration {
            border: 1px solid var(--gold);
            outline: 3px double var(--gold);
            outline-offset: -12px;
            width: 80%;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            text-align: center;
        }

        .polaroid {
            width: 70%;
            background: white;
            padding: 8px 8px 35px 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: rotate(2deg);
            opacity: 0;
            transition: all 0.7s ease 0.8s;
            border: 1px solid #ddd;
        }

        .polaroid img { width: 100%; height: auto; display: block; }

        .wish-text {
            color: #333;
            text-align: center;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.7s ease 1s;
        }

        .open .cover-wrapper { transform: rotateY(-180deg); }
        .open .polaroid { opacity: 1; transform: rotate(-1deg); }
        .open .wish-text { opacity: 1; }

        .hint {
            position: absolute;
            bottom: 20px;
            color: #444;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="landscape-lock">
        <div class="phone-icon">📱🔄</div>
        <h2>Mohon Miringkan HP Anda</h2>
        <p>Gunakan mode landscape untuk membuka kejutan</p>
    </div>

    <audio id="hbdAudio" loop>
        <source src="https://files.catbox.moe/9d7hp4.mp3" type="audio/mpeg">
    </audio>

    <div id="main-wrapper">
        <div class="book-container" id="bookCont">
            <div class="book" onclick="openBook()">
                <div class="cover-wrapper">
                    <div class="cover-front">
                        <div class="gold-decoration">
                            <h2 style="margin:0; font-weight: normal; letter-spacing: 2px;">A SIMPLE</h2>
                            <h1 style="font-size: 2.2rem; margin: 10px 0;">THING</h1>
                            <p style="font-size: 0.7rem;">FOR YOU</p>
                        </div>
                    </div>
                    <div class="cover-back-page">
                        <div class="wish-text">
                            <h3 style="margin:0; margin-bottom: 30px;">Dearest One,</h3>
                            <p style="font-size: 1rem;">"Setiap tahun adalah peringatan bahwa kita memiliki kesempatan baru untuk membuat impian kita menjadi kenyataan."</p>
                            <div style="font-size: 1.2rem; margin-top: 30px;">❦</div>
                        </div>
                    </div>
                </div>
                <div class="page-right">
                    <div class="center-spine"></div>
                    <div class="polaroid">
                        <img src="https://i.ibb.co.com/Z1vv5gYS/aku.jpg" alt="aku">
                        <div style="margin-top: 10px; text-align: center; font-family: 'Brush Script MT', cursive; font-size: 1.2rem;">
                            Happy Birthday! ✨
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <p class="hint">Sentuh untuk membuka 📖</p>

    <script>
        function openBook() {
            // Mencegah buku dibuka jika dalam posisi portrait di HP
            if (window.innerHeight > window.innerWidth && window.innerWidth < 900) {
                return; 
            }

            const cont = document.getElementById('bookCont');
            const audio = document.getElementById('hbdAudio');
            cont.classList.toggle('open');
            
            if(cont.classList.contains('open')) { 
                audio.play().catch(() => {}); 
            } else { 
                audio.pause();
                audio.currentTime = 0; 
            }
        }
    </script>
</body>
</html>
