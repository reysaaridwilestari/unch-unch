<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kado Buku - Landscape Mode</title>
    <style>
        :root {
            --bg-color: #aeb5b8;
            --book-cover: #3d0a0a;
            --paper: #fefcf0;
            --gold: #d4af37;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 2500px;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        /* --- LOGIKA AUTO-ROTATE UNTUK HP --- */
        /* Jika HP dalam posisi berdiri (Portrait), kita putar container-nya 90 derajat */
        @media screen and (max-width: 900px) and (orientation: portrait) {
            #main-wrapper {
                transform: rotate(90deg);
            }
            .hint-rotate {
                display: block !important;
            }
        }

        .hint-rotate {
            display: none;
            position: fixed;
            top: 10px;
            color: #444;
            font-size: 10px;
            text-align: center;
            width: 100%;
            z-index: 100;
        }

        /* BUKU TETAP FORMAT PORTRAIT (BUKU TULIS) */
        .book-container {
            position: relative;
            width: 320px;
            height: 460px;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            transform: rotateX(10deg) rotateY(-5deg);
        }

        .book-container.open {
            /* Geser ke kanan saat terbuka */
            transform: translateX(160px) rotateX(0deg) rotateY(0deg);
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        /* Siluet Lipatan Tengah */
        .center-fold {
            position: absolute;
            left: 0;
            width: 4px;
            height: 100%;
            background: rgba(0,0,0,0.15);
            z-index: 20;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
        }

        .cover-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform-origin: left;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
        }

        .cover-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--book-cover);
            background-image: url('https://www.transparenttextures.com/patterns/leather.png');
            border-radius: 2px 8px 8px 2px;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
        }

        .cover-back-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 8px 2px 2px 8px;
            transform: rotateY(180deg);
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: inset -40px 0 50px rgba(0,0,0,0.1); /* Bayangan batas */
        }

        .page-right {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 2px 8px 8px 2px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 40px 0 50px rgba(0,0,0,0.1); /* Bayangan batas */
        }

        .gold-decoration {
            border: 1px solid var(--gold);
            outline: 3px double var(--gold);
            outline-offset: -12px;
            width: 80%;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .polaroid {
            width: 70%;
            background: white;
            padding: 8px 8px 35px 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: rotate(2deg);
            opacity: 0;
            transition: all 0.7s ease 0.8s;
        }

        .polaroid img { width: 100%; height: auto; display: block; }

        .wish-text {
            color: #333;
            text-align: center;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.7s ease 1s;
        }

        .open .cover-wrapper { transform: rotateY(-180deg); }
        .open .polaroid { opacity: 1; transform: rotate(-1deg); }
        .open .wish-text { opacity: 1; }

        .hint {
            position: absolute;
            bottom: 20px;
            color: #444;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="hint-rotate">Miringkan HP untuk tampilan terbaik 🔄</div>

    <audio id="hbdAudio" loop>
        <source src="https://files.catbox.moe/9d7hp4.mp3" type="audio/mpeg">
    </audio>

    <div id="main-wrapper">
        <div class="book-container" id="bookCont">
            <div class="book" onclick="openBook()">
                <div class="cover-wrapper">
                    <div class="cover-front">
                        <div class="gold-decoration">
                            <h2 style="margin:0; font-weight: normal; letter-spacing: 4px;">A SIMPLE</h2>
                            <h1 style="font-size: 2.2rem; margin: 10px 0;">THING</h1>
                            <p style="font-size: 0.7rem;">FOR YOU</p>
                        </div>
                    </div>
                    
                    <div class="cover-back-page">
                        <div class="wish-text">
                            <h3 style="margin:0;">Dearest One,</h3>
                            <p>"Setiap lembar masa, moga bahagiamu kian subur. Selamat meraikan hari lahirmu."</p>
                            <div style="font-size: 1.5rem;">❦</div>
                        </div>
                    </div>
                </div>

                <div class="page-right">
                    <div class="center-fold"></div>
                    <div class="polaroid">
                        <img src="https://i.ibb.co/v4m0Yv8/yy.jpg" alt="Memory">
                        <div style="margin-top: 10px; text-align: center; font-family: 'Brush Script MT', cursive; font-size: 1.2rem;">
                            Happy Birthday! ✨
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <p class="hint">Sentuh untuk membuka 📖</p>

    <script>
        function openBook() {
            const cont = document.getElementById('bookCont');
            const audio = document.getElementById('hbdAudio');
            cont.classList.toggle('open');
            if(cont.classList.contains('open')) { 
                audio.play().catch(() => {}); 
            } else { 
                audio.pause();
                audio.currentTime = 0; 
            }
        }
    </script>
</body>
</html>
