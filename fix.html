<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Surprise - Premium Album</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

        :root {
            --bg-game: #fff5f5;
            --btn-pink: #db2777;
            --bg-book: #d1d8dc;
            --book-cover: #3d0a0a;
            --paper: #fefcf0;
            --gold: #d4af37;
            --leather: url('https://www.transparenttextures.com/patterns/leather.png');
            --paper-texture: url('https://www.transparenttextures.com/patterns/cream-paper.png');
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background-color: var(--bg-game);
            transition: background 1s ease;
            touch-action: manipulation;
        }

        /* --- UI COMPONENTS --- */
        .container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border: 2px solid #ffffff;
            border-radius: 30px;
            padding: 25px 20px;
            box-shadow: 0 20px 60px rgba(255, 182, 193, 0.2);
            text-align: center;
            width: 85%;
            max-width: 280px;
            z-index: 10;
        }

        /* Update Teks Cocokkan Kartu */
        .game-title {
            font-size: 1.1rem; 
            font-weight: 800; 
            color: var(--btn-pink); 
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .btn-action {
            background: var(--btn-pink); color: white; border: none; padding: 12px 24px;
            border-radius: 50px; font-weight: 600; cursor: pointer; margin-top: 15px;
            text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px;
        }

        /* --- GAME SECTION --- */
        #game-section { display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .card { width: 60px; height: 60px; perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        .card-front { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); border: 1px solid white; }
        .card-back { background: #ffffff; transform: rotateY(180deg); font-size: 1.5rem; }
        .card.matched { opacity: 0; transition: 0.5s; pointer-events: none; }
        #reveal-game-btn { display: none; }

        /* --- GREETING SECTION --- */
        #greeting-section { display: none; opacity: 0; flex-direction: column; align-items: center; transition: 0.8s; }

        /* --- BOOK SECTION --- */
        #book-section { 
            display: none; width: 100vw; height: 100vh; 
            justify-content: center; align-items: center; 
            perspective: 1500px; opacity: 0; transition: opacity 1s;
        }
        
        .book { 
            position: relative; 
            width: clamp(230px, 38vw, 300px); 
            height: clamp(330px, 52vw, 400px);
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1); 
            transform-style: preserve-3d; 
        }

        .book.opened { transform: translateX(25%); }

        .page { 
            position: absolute; width: 100%; height: 100%; 
            transform-origin: left; transform-style: preserve-3d; 
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer;
        }

        .front, .back { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; display: flex; 
            flex-direction: column; justify-content: center; 
            align-items: center; padding: 15px; box-sizing: border-box; 
        }

        .back { transform: rotateY(180deg); }
        
        .flipped .front { box-shadow: inset -150px 0 50px rgba(0,0,0,0.1); }
        .flipped .back { box-shadow: inset 150px 0 50px rgba(0,0,0,0.05); }

        .cover-front { background-color: var(--book-cover); background-image: var(--leather); color: var(--gold); border-radius: 0 5px 5px 0; z-index: 4; }
        .cover-back { background-color: var(--book-cover); background-image: var(--leather); color: var(--gold); border-radius: 5px 0 0 5px; }
        
        .page-paper { background-color: var(--paper); background-image: var(--paper-texture); }
        .page-paper.front { border-radius: 0 5px 5px 0; }
        .page-paper.back { border-radius: 5px 0 0 5px; border-right: 1px solid rgba(0,0,0,0.05); }

        .gold-decoration { border: 1px solid var(--gold); outline: 3px double var(--gold); outline-offset: -8px; width: 90%; height: 92%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        .polaroid { 
            width: 70%; 
            background: white; 
            padding: 5px 5px 18px 5px; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.12); 
            transform: rotate(var(--r, 0deg)); 
            border: 1px solid #eee;
        }
        .polaroid img { 
            width: 100%; 
            aspect-ratio: 3/4; 
            object-fit: cover; 
        }
        .polaroid p { 
            margin: 8px 0 0 0; 
            font-family: 'Playfair Display', serif; 
            font-size: 0.65rem; 
            color: #444; 
        }

        .flipped { transform: rotateY(-180deg); z-index: 10 !important; }

        #landscape-lock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; text-align: center; padding: 20px; box-sizing: border-box; }
        @media screen and (max-width: 900px) and (orientation: portrait) { .show-lock #landscape-lock { display: flex; } }
        
        #p1 { z-index: 4; } #p2 { z-index: 3; } #p3 { z-index: 2; } #p4 { z-index: 1; }
    </style>
</head>
<body>

    <audio id="hbdAudio" loop><source src="https://files.catbox.moe/9d7hp4.mp3" type="audio/mpeg"></audio>

    <div id="game-section">
        <div class="container">
            <p class="game-title">COCOKKAN KARTU</p>
            <div class="grid" id="game-grid"></div>
            <button id="reveal-game-btn" class="btn-action" onclick="showGreeting()">NEXT</button>
        </div>
    </div>

    <div id="greeting-section">
        <div class="container">
            <h2 style="font-family: 'Playfair Display'; color: var(--btn-pink); font-weight: 800;">WIDDIHHH</h2>
            <p style="font-size: 0.85rem; color: #64748b;">Lanjutin yaaa</p>
            <button class="btn-action" onclick="showAlbum()">NEXT</button>
        </div>
    </div>

    <div id="book-section">
        <div id="landscape-lock">
            <p style="font-size: 30px;">📱🔄</p>
            <h3 style="font-family: 'Playfair Display';">Miringin HPnyaaaa</h3>
            <p style="font-size: 0.8rem; color: #888;">Pake mode landscape</p>
        </div>
        
        <div class="book" id="book">
            <div class="page" id="p1" onclick="nextPage(1)">
                <div class="front cover-front">
                    <div class="gold-decoration">
                        <h1 style="font-size: 1.5rem; font-family: 'Playfair Display';">Our Story</h1>
                    </div>
                </div>
                <div class="back page-paper">
                    <p style="font-style: italic; font-size: 0.75rem; padding: 20px; text-align: center; color: #555;">"Semoga hari istimewamu seindah senyumanmu. Teruslah bersinar, teruslah bermimpi, dan jadilah versi terbaik dari dirimu sendiri."</p>
                </div>
            </div>

            <div class="page" id="p2" onclick="nextPage(2)">
                <div class="front page-paper">
                    <div class="polaroid" style="--r: -1.5deg">
                        <img src="https://i.ibb.co.com/PGjX0yDc/IMG-4753.jpg">
                        <p>Memories ✨</p>
                    </div>
                </div>
                <div class="back page-paper">
                    <div class="polaroid" style="--r: 2.5deg">
                        <img src="https://picsum.photos/600/800?random=12">
                        <p>Happy Moments 🌸</p>
                    </div>
                </div>
            </div>

            <div class="page" id="p3" onclick="nextPage(3)">
                <div class="front page-paper">
                    <div class="polaroid" style="--r: 1deg">
                        <img src="https://picsum.photos/600/800?random=13">
                        <p>Special Day ☀️</p>
                    </div>
                </div>
                <div class="back page-paper">
                    <div class="polaroid" style="--r: -2deg">
                        <img src="https://picsum.photos/600/800?random=14">
                        <p>Stay with Me 💫</p>
                    </div>
                </div>
            </div>

            <div class="page" id="p4" onclick="nextPage(4)">
                <div class="front page-paper">
                    <div class="polaroid">
                        <img src="https://picsum.photos/600/800?random=15">
                        <p>Forever 💖</p>
                    </div>
                </div>
                <div class="back cover-back">
                    <div class="gold-decoration"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const EMOJIS = ['🎂', '💖', '🎉', '🎈'];
        let matches = 0, flippedCards = [], isLocked = false, step = 0;
        const audio = document.getElementById('hbdAudio');

        function initGame() {
            const grid = document.getElementById('game-grid');
            const deck = [...EMOJIS, ...EMOJIS].sort(() => 0.5 - Math.random());
            deck.forEach(emoji => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-inner"><div class="card-front"></div><div class="card-back">${emoji}</div></div>`;
                card.onclick = () => {
                    if (isLocked || card.classList.contains('flipped')) return;
                    card.classList.add('flipped');
                    flippedCards.push({ card, emoji });
                    if (flippedCards.length === 2) {
                        isLocked = true;
                        setTimeout(() => {
                            if (flippedCards[0].emoji === flippedCards[1].emoji) {
                                flippedCards.forEach(c => c.card.classList.add('matched'));
                                matches += 2;
                                if (matches === 8) {
                                    document.getElementById('reveal-game-btn').style.display = 'inline-block';
                                }
                            } else {
                                flippedCards.forEach(c => c.card.classList.remove('flipped'));
                            }
                            flippedCards = []; isLocked = false;
                        }, 600);
                    }
                };
                grid.appendChild(card);
            });
        }

        function showGreeting() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#db2777', '#ff9a9e', '#fecfef', '#d4af37']
            });

            document.getElementById('game-section').style.display = 'none';
            const greet = document.getElementById('greeting-section');
            greet.style.display = 'flex';
            setTimeout(() => greet.style.opacity = '1', 50);
        }

        function showAlbum() {
            document.body.classList.add('show-lock');
            document.getElementById('greeting-section').style.display = 'none';
            document.body.style.backgroundColor = 'var(--bg-book)';
            document.getElementById('book-section').style.display = 'flex';
            setTimeout(() => document.getElementById('book-section').style.opacity = '1', 50);
        }

        function nextPage(s) {
            const book = document.getElementById('book');
            if (audio.paused) audio.play().catch(e => {});

            if (s === 1 && step === 0) {
                book.classList.add('opened');
                document.getElementById('p1').classList.add('flipped');
                step = 1;
            } else if (s > step && s < 4) {
                document.getElementById('p' + s).classList.add('flipped'); 
                step = s;
            } else if (s === 4 && step === 3) {
                document.getElementById('p4').classList.add('flipped'); 
                step = 4;
            } else if (step === 4) {
                ["p4", "p3", "p2", "p1"].forEach((id, i) => {
                    setTimeout(() => {
                        document.getElementById(id).classList.remove('flipped');
                        if (i === 3) { 
                            setTimeout(() => { book.classList.remove('opened'); step = 0; }, 600); 
                        }
                    }, i * 150);
                });
            }
        }
        
        initGame();
    </script>
</body>
</html>
