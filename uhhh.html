<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kado Buku Ultra-Realistis</title>
    <style>
        /* CSS EXISTING KAMU TETAP SAMA */
        :root {
            --bg-color: #aeb5b8;
            --book-cover: #3d0a0a;
            --paper: #fefcf0;
            --gold: #d4af37;
        }

        /* --- TAMBAHAN CSS LOADING SCREEN --- */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #aeb5b8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--book-cover);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mencegah buku diklik saat loading */
        .disabled { pointer-events: none; opacity: 0.5; }

        /* SISA CSS KAMU (book-container, polaroid, dll masukkan di sini) */
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; perspective: 2500px; font-family: 'Georgia', serif; }
        .book-container { position: relative; width: 350px; height: 500px; transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1); transform-style: preserve-3d; transform: rotateX(10deg) rotateY(-5deg); }
        .book-container.open { transform: translateX(175px) rotateX(0deg) rotateY(0deg); }
        .book { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; cursor: pointer; }
        .cover-wrapper { position: absolute; width: 100%; height: 100%; z-index: 10; transform-origin: left; transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1); transform-style: preserve-3d; }
        .cover-front { position: absolute; width: 100%; height: 100%; background-color: var(--book-cover); background-image: url('https://www.transparenttextures.com/patterns/leather.png'); border-radius: 2px 10px 10px 2px; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; z-index: 2; box-shadow: inset -5px 0 10px rgba(0,0,0,0.5); }
        .cover-back-page { position: absolute; width: 100%; height: 100%; background-color: var(--paper); border-radius: 10px 2px 2px 10px; transform: rotateY(180deg); backface-visibility: hidden; z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; box-sizing: border-box; box-shadow: inset -40px 0 50px rgba(0,0,0,0.15), inset -1px 0 2px rgba(0,0,0,0.2); }
        .page-right { position: absolute; width: 99%; height: 99%; top: 0.5%; left: 0; background-color: var(--paper); border-radius: 2px 10px 10px 2px; z-index: 5; display: flex; justify-content: center; align-items: center; box-shadow: inset 40px 0 50px rgba(0,0,0,0.15), inset 1px 0 2px rgba(0,0,0,0.2); }
        .polaroid { width: 65%; background: white; padding: 10px 10px 45px 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e0e0e0; transform: rotate(2deg); opacity: 0; transition: all 0.7s ease-out 0.8s; }
        .polaroid img { width: 100%; height: auto; max-height: 280px; object-fit: cover; }
        .open .cover-wrapper { transform: rotateY(-180deg); }
        .open .polaroid { opacity: 1; transform: rotate(-1deg) scale(1); }
        .hint { position: absolute; bottom: 20px; color: #444; font-size: 13px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="loader"></div>
        <p style="margin-top: 15px; font-weight: bold; color: #3d0a0a;">Menyiapkan kado...</p>
    </div>

    <audio id="hbdAudio" preload="auto">
        <source src="ABE.mp3" type="audio/mpeg">
    </audio>

    <div class="book-container disabled" id="bookCont">
        <div class="book" onclick="openBook()">
            <div class="cover-wrapper">
                <div class="cover-front">
                    <div style="border: 1px solid var(--gold); outline: 4px double var(--gold); outline-offset: -15px; width: 80%; height: 85%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--gold);">
                        <h2 style="margin:0;">A SIMPLE</h2>
                        <h1 style="font-size: 2.5rem; margin: 10px 0;">THING</h1>
                    </div>
                </div>
                <div class="cover-back-page">
                    <p>"Selamat ulang tahun..."</p>
                </div>
            </div>

            <div class="page-right">
                <div class="polaroid">
                    <img src="yy.jpg" alt="Memory">
                    <p style="text-align: center; font-family: 'Brush Script MT', cursive;">Always Happy! ✨</p>
                </div>
            </div>
        </div>
    </div>

    <p id="hint-text" class="hint" style="display:none;">Sentuh untuk membuka 📖</p>

    <script>
        const audio = document.getElementById('hbdAudio');
        const overlay = document.getElementById('loading-overlay');
        const book = document.getElementById('bookCont');
        const hint = document.getElementById('hint-text');

        // FUNGSI UTAMA: Deteksi audio siap
        audio.oncanplaythrough = function() {
            // Hilangkan loading screen
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                // Aktifkan buku agar bisa diklik
                book.classList.remove('disabled');
                hint.style.display = 'block';
            }, 500);
        };

        function openBook() {
            book.classList.toggle('open');
            if(book.classList.contains('open')) { 
                audio.play(); 
            } else { 
                audio.pause();
                audio.currentTime = 0; 
            }
        }
    </script>
</body>
</html>
