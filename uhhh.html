<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kado Buku Ultra-Realistis</title>
    <style>
        :root {
            --bg-color: #aeb5b8;
            --book-cover: #3d0a0a; /* Warna kulit merah marun tua */
            --paper: #fefcf0; /* Tekstur kertas antik */
            --gold: #d4af37;
            --spine-width: 8px;
            --book-width: clamp(160px, 42vw, 350px);
            --book-height: clamp(240px, 62vw, 500px);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 2500px;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .book-container {
            position: relative;
            width: var(--book-width);
            height: var(--book-height);
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
            transform: rotateX(10deg) rotateY(-5deg);
        }

        .book-container.open {
            transform: translateX(calc(var(--book-width) / 2)) rotateX(0deg) rotateY(0deg);
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .book::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 100%;
            height: 99%;
            background: #fff;
            border-radius: 0 5px 5px 0;
            transform: translateZ(-15px);
            box-shadow: 10px 10px 40px rgba(0,0,0,0.4), inset -2px 0 5px rgba(0,0,0,0.1);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 1px, #ddd 1px, #ddd 2px);
        }

        .cover-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform-origin: left;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-style: preserve-3d;
        }

        .cover-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--book-cover);
            background-image: url('https://www.transparenttextures.com/patterns/leather.png');
            border-radius: 2px 10px 10px 2px;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
        }

        .cover-back-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--paper);
            border-radius: 10px 2px 2px 10px;
            transform: rotateY(180deg);
            backface-visibility: hidden;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: inset -40px 0 50px rgba(0,0,0,0.15), inset -1px 0 2px rgba(0,0,0,0.2);
        }

        .page-right {
            position: absolute;
            width: 99%;
            height: 99%;
            top: 0.5%;
            left: 0;
            background-color: var(--paper);
            border-radius: 2px 10px 10px 2px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 40px 0 50px rgba(0,0,0,0.15), inset 1px 0 2px rgba(0,0,0,0.2);
        }

        .gold-decoration {
            border: 1px solid var(--gold);
            outline: 4px double var(--gold);
            outline-offset: -15px;
            width: 80%;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* PERUBAHAN DI SINI: Polaroid Lebih Kecil */
        .polaroid {
            width: 65%; /* Dari 80% ke 65% */
            background: white;
            padding: 10px 10px 45px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            transform: rotate(2deg);
            opacity: 0;
            transition: all 0.7s ease-out 0.8s;
        }

        .polaroid img {
            width: 100%;
            height: auto; /* Auto supaya tidak herot (stretched) */
            max-height: 280px;
            object-fit: cover;
            filter: sepia(0.2) contrast(1.1);
        }

        .wish-text {
            color: #333;
            text-align: center;
            font-style: italic;
            line-height: 1.8;
            opacity: 0;
            transition: opacity 0.7s ease 1s;
            font-size: clamp(0.7rem, 3vw, 1rem);
            line-height: 1.5;
        }

        .center-fold {
            position: absolute;
            left: 0;
            width: 2px;
            height: 100%;
            background: rgba(0,0,0,0.2);
            z-index: 20;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .open .cover-wrapper {
            transform: rotateY(-180deg);
        }
        
        .open .polaroid {
            opacity: 1;
            transform: rotate(-1deg) scale(1);
        }

        .open .wish-text {
            opacity: 1;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            color: #444;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <audio id="hbdAudio" loop>
        <source src="https://files.catbox.moe/9d7hp4.mp3" type="audio/mpeg">
    </audio>

    <div class="book-container" id="bookCont">
        <div class="book" onclick="openBook()">
            <div class="cover-wrapper">
                <div class="cover-front">
                    <div class="gold-decoration">
                        <h2 style="margin:0; font-weight: normal; letter-spacing: 4px;">A SIMPLE</h2>
                        <h1 style="font-size: 2.5rem; margin: 10px 0;">THING</h1>
                        <div style="width: 40px; height: 1px; background: var(--gold);"></div>
                        <p style="font-size: 0.7rem; margin-top: 15px;">FOR YOU</p>
                    </div>
                </div>
                
                <div class="cover-back-page">
                    <div class="wish-text">
                        <h3 style="font-family: 'Times New Roman', serif; color: var(--book-cover);">Dearest One,</h3>
                        <p>"Setiap lembar masa, moga bahagiamu kian subur. Selamat meraikan hari lahirmu yang istimewa."</p>
                        <div style="margin-top: 30px; font-size: 1.5rem;">❦</div>
                    </div>
                </div>
            </div>

            <div class="page-right">
                <div class="center-fold"></div>
                <div class="polaroid">
                    <img src=".jpg" alt="Memory">
                    <div style="margin-top: 15px; text-align: center; font-family: 'Brush Script MT', cursive; font-size: 1.4rem;">
                        Always Happy! ✨
                    </div>
                </div>
            </div>
        </div>
    </div>

    <p class="hint">Sentuh untuk membuka 📖</p>

    <script>
        function openBook() {
            const cont = document.getElementById('bookCont');
            const audio = document.getElementById('hbdAudio');
            
            cont.classList.toggle('open');
            
            if(cont.classList.contains('open')) { 
                // Jika dibuka, mainkan muzik
                audio.play().catch(() => {}); 
            } else { 
                // Jika ditutup, hentikan muzik dan reset ke permulaan (0)
                audio.pause();
                audio.currentTime = 0; 
            }
        }
    </script>
</body>
</html>
